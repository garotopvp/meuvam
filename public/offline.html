<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Superação - Offline</title>
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #fcfdfe;
            color: #1c1c1e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
        h1 { font-weight: 800; margin-bottom: 10px; }
        p { color: #8e8e93; line-height: 1.5; max-width: 300px; }
        .btn {
            margin-top: 30px;
            background: linear-gradient(135deg, #ff3b30 0%, #ff2d55 100%);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 14px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="icon">🏃‍♂️</div>
    <h1>Você está offline</h1>
    <p>Parece que você ficou sem sinal. Seus treinos sincronizados ainda podem ser vistos, mas algumas funções precisam de internet.</p>
    <button class="btn" onclick="window.location.reload()">Tentar Novamente</button>
</body>
</html>
