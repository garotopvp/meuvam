<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Superação - Cadastrar Professor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <base href="/professor/">
    <style>
        :root {
            --primary: #ef4444;
            --primary-hover: #dc2626;
            --bg: #f8fafc;
            --card: #FFFFFF;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --input-bg: #FFFFFF;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Inter', -apple-system, sans-serif; 
            background: var(--bg); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh;
            color: var(--text);
            padding: 40px 20px;
        }

        .back-nav {
            position: fixed;
            top: 24px;
            left: 24px;
            z-index: 100;
        }

        .btn-back {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }

        .btn-back:hover {
            color: var(--text);
            border-color: var(--text);
            transform: translateX(-4px);
        }

        .auth-wrapper {
            width: 100%;
            max-width: 440px;
            text-align: center;
        }

        .logo-area {
            margin-bottom: 24px;
        }

        .auth-card {
            background: var(--card);
            border-radius: 24px;
            padding: 40px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.03);
        }

        .card-title {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 28px;
            letter-spacing: -0.5px;
        }

        .input-group {
            position: relative;
            margin-bottom: 12px;
            text-align: left;
        }

        .input-group i:not(.toggle-pass) {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 18px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px 14px 48px;
            border: 1.5px solid var(--border);
            border-radius: 14px;
            font-size: 15px;
            font-family: inherit;
            outline: none;
            transition: all 0.2s;
            background: var(--input-bg);
        }

        .input-group input:focus {
            border-color: var(--primary);
            background: #fff;
        }

        .toggle-pass {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--text-muted);
            font-size: 18px;
            z-index: 10;
        }

        .btn-entrar {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 12px;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.2);
        }

        .btn-entrar:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(239, 68, 68, 0.3);
        }

        .footer-link {
            margin-top: 24px;
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .footer-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
        }

        #auth-message {
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }

        .loader {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <nav class="back-nav">
        <a href="login.html" class="btn-back">
            <i class="ri-arrow-left-line"></i> Voltar
        </a>
    </nav>

    <div class="auth-wrapper">
        <div class="logo-area">
            <div style="width: 180px; height: 150px; margin: 0 auto;">
                <img src="/assets/logo.png" alt="Superação Logo" style="width: 100%; height: 100%; object-fit: contain;">
            </div>
        </div>

        <div class="auth-card">
            <div style="display: inline-block; padding: 4px 12px; background: rgba(239, 68, 68, 0.1); color: var(--primary); border-radius: 100px; font-size: 10px; font-weight: 800; margin-bottom: 16px; text-transform: uppercase; letter-spacing: 0.5px;">
                Cadastro de Professor
            </div>
            <h2 class="card-title">Crie sua conta profissional</h2>
            
            <div id="auth-message"></div>

            <div class="input-group">
                <i class="ri-user-line"></i>
                <input type="text" id="auth-name" placeholder="Seu nome completo">
            </div>

            <div class="input-group">
                <i class="ri-mail-line"></i>
                <input type="email" id="auth-email" placeholder="Seu melhor e-mail">
            </div>

            <div class="input-group">
                <i class="ri-lock-line"></i>
                <input type="password" id="auth-pass" placeholder="Crie uma senha (mín. 6 caracteres)">
                <i class="ri-eye-off-line toggle-pass" onclick="togglePass('auth-pass', this)"></i>
            </div>

            <div class="input-group">
                <i class="ri-lock-password-line"></i>
                <input type="password" id="auth-pass-confirm" placeholder="Confirme sua senha">
                <i class="ri-eye-off-line toggle-pass" onclick="togglePass('auth-pass-confirm', this)"></i>
            </div>

            <button class="btn-entrar" id="register-btn" onclick="register()">
                Cadastrar Agora
            </button>

            <div class="footer-link">
                Já é cadastrado? <a href="login.html">Faça login no portal</a>
            </div>
        </div>
    </div>

    <script>
        function togglePass(id, icon) {
            const input = document.getElementById(id);
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('ri-eye-off-line');
                icon.classList.add('ri-eye-line');
            } else {
                input.type = 'password';
                icon.classList.remove('ri-eye-line');
                icon.classList.add('ri-eye-off-line');
            }
        }
    </script>
    <script src="auth.js"></script>
</body>
</html>
