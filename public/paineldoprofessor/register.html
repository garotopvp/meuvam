<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Superação - Cadastrar Professor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <base href="/paineldoprofessor/">
    <style>
        :root {
            --primary: #007AFF;
            --primary-hover: #0063D1;
            --bg: #F8F9FB;
            --card: #FFFFFF;
            --text: #1D1D1F;
            --text-muted: #86868B;
            --border: #E5E5E7;
            --input-bg: #FFFFFF;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Inter', -apple-system, sans-serif; 
            background: var(--bg); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh;
            color: var(--text);
            padding: 20px;
        }

        .auth-wrapper {
            width: 100%;
            max-width: 440px;
            text-align: center;
        }

        .logo-area {
            margin-bottom: 32px;
        }

        .logo-box {
            width: 64px;
            height: 64px;
            background: var(--primary);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            box-shadow: 0 8px 20px rgba(0, 122, 255, 0.2);
        }

        .logo-box i {
            font-size: 32px;
            color: white;
        }

        .brand-name {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: -1px;
        }

        .auth-card {
            background: var(--card);
            border-radius: 32px;
            padding: 40px;
            border: 1px solid var(--border);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.04);
        }

        .card-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 28px;
            letter-spacing: -0.5px;
        }

        .input-group {
            position: relative;
            margin-bottom: 12px;
            text-align: left;
        }

        .input-group i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 18px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px 14px 48px;
            border: 1px solid var(--border);
            border-radius: 14px;
            font-size: 15px;
            font-family: inherit;
            outline: none;
            transition: all 0.2s;
            background: var(--input-bg);
        }

        .input-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.1);
        }

        .toggle-pass {
            position: absolute !important;
            right: 16px;
            left: auto !important;
            cursor: pointer;
            color: var(--text-muted);
            transition: color 0.2s;
            z-index: 5;
        }

        .toggle-pass:hover {
            color: var(--primary);
        }

        .btn-entrar {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 12px;
        }

        .btn-entrar:hover {
            background: var(--primary-hover);
        }

        .footer-link {
            margin-top: 24px;
            font-size: 14px;
            color: var(--text-muted);
        }

        .footer-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
        }

        #auth-message {
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="auth-wrapper">
        <div class="logo-area">
            <div class="logo-box" style="background: white; overflow: hidden; padding: 10px;">
                <img src="/assets/logo.png" alt="Superação Logo" style="width: 100%; height: 100%; object-fit: contain;">
            </div>
            <h1 class="brand-name">Superação</h1>
        </div>

        <div class="auth-card">
            <div style="display: inline-block; padding: 4px 12px; background: rgba(0, 122, 255, 0.1); color: var(--primary); border-radius: 100px; font-size: 11px; font-weight: 700; margin-bottom: 16px; text-transform: uppercase; letter-spacing: 0.5px;">
                <i class="ri-shield-user-line"></i> Portal do Professor
            </div>
            <h2 class="card-title">Criar Conta de Professor</h2>
            
            <div id="auth-message"></div>

            <div class="input-group">
                <i class="ri-user-line"></i>
                <input type="text" id="auth-name" placeholder="Seu Nome Completo">
            </div>

            <div class="input-group">
                <i class="ri-mail-line"></i>
                <input type="email" id="auth-email" placeholder="E-mail">
            </div>

            <div class="input-group">
                <i class="ri-lock-line"></i>
                <input type="password" id="auth-pass" placeholder="Senha (Mínimo 6 caracteres)">
                <i class="ri-eye-off-line toggle-pass" onclick="togglePass('auth-pass', this)"></i>
            </div>

            <div class="input-group">
                <i class="ri-lock-password-line"></i>
                <input type="password" id="auth-pass-confirm" placeholder="Confirmar Senha">
                <i class="ri-eye-off-line toggle-pass" onclick="togglePass('auth-pass-confirm', this)"></i>
            </div>

            <button class="btn-entrar" id="register-btn" onclick="register()">
                Cadastrar
            </button>

            <div class="footer-link">
                Já tem uma conta? <a href="login.html">Faça Login</a>
            </div>

            <div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border);">
                <a href="/aluno" style="font-size: 12px; color: var(--text-muted); text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 6px;">
                    <i class="ri-arrow-left-line"></i> Sou Aluno? <span style="color: var(--text); font-weight: 600;">Voltar ao Início</span>
                </a>
            </div>
        </div>
    </div>

    <script>
        function togglePass(id, icon) {
            const input = document.getElementById(id);
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('ri-eye-off-line');
                icon.classList.add('ri-eye-line');
            } else {
                input.type = 'password';
                icon.classList.remove('ri-eye-line');
                icon.classList.add('ri-eye-off-line');
            }
        }
    </script>
    <script src="auth.js"></script>
</body>
</html>
